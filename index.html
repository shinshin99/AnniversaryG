
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1233">
<title>For you, Baby 💗</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #fff3ee;
  --rose: #ff8fab;
  --glow: #ffc2d1;
}

* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  color: var(--ink);
  font-family: "Cormorant Garamond", Georgia, serif;
  background: radial-gradient(
    ellipse at 50% 108%,
    #6b2a63 0,
    #3a1a58 38%,
    #1d1233 72%,
    #120a24 100%
  );
}

#sky, #garden, #fall {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  opacity: .5;
  animation: tw 4s ease-in-out infinite;
}

@keyframes tw {
  50% { opacity: .1; }
}

.fly {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #ffe9a8;
  box-shadow: 0 0 10px 3px rgba(255,226,140,.7);
  opacity: 0;
  animation: fly 9s ease-in-out infinite;
}

@keyframes fly {
  0% { opacity: 0; transform: translate(0,0); }
  20%,80% { opacity: .9; }
  50% { transform: translate(30px,-40px); }
  100% { opacity: 0; transform: translate(-20px,-80px); }
}

.ground {
  position: absolute;
  left: -5%;
  right: -5%;
  bottom: -2px;
  height: 7vh;
  background: linear-gradient(#1b2a2a,#0e1620);
  border-radius: 50% 50% 0 0/100% 100% 0 0;
}

.flower {
  position: absolute;
  bottom: 3vh;
  width: 0;
  height: 0;
  transform-origin: bottom;
  animation: sway 6s ease-in-out infinite alternate;
}

@keyframes sway {
  from { transform: rotate(-2deg); }
  to { transform: rotate(2deg); }
}

.stem {
  position: absolute;
  bottom: 0;
  left: -2px;
  width: 4px;
  border-radius: 2px;
  background: linear-gradient(#5fae7a,#2c6b50);
  transform-origin: bottom;
  transform: scaleY(0);
  animation: grow 2.2s cubic-bezier(.3,.7,.3,1) forwards;
}

@keyframes grow {
  to { transform: scaleY(1); }
}

.leaf {
  position: absolute;
  width: 22px;
  height: 10px;
  border-radius: 100% 0;
  background: #4a9a70;
  opacity: 0;
  animation: pop .8s ease forwards;
}

@keyframes pop {
  to { opacity: 1; }
}

.bloom {
  position: absolute;
  left: 0;
  width: 0;
  height: 0;
}

.petal {
  position: absolute;
  left: -12px;
  bottom: 0;
  width: 24px;
  height: 54px;
  border-radius: 50% 50% 50% 50%/75% 75% 25% 25%;
  transform-origin: 50% 100%;
  transform: rotate(var(--a)) scale(0);
  background: radial-gradient(
    ellipse at 50% 85%,
    var(--c2),
    var(--c1) 70%
  );
  box-shadow: 0 0 14px rgba(255,170,200,.35);
  animation: open 1.8s cubic-bezier(.2,.9,.25,1.15) forwards;
}

@keyframes open {
  to { transform: rotate(var(--a)) scale(1); }
}

.core {
  position: absolute;
  left: -9px;
  top: -9px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: radial-gradient(#fff2b8,#f6b93b);
  transform: scale(0);
  animation: open0 .8s ease forwards;
}

@keyframes open0 {
  to { transform: scale(1); }
}

/* MAIN CONTENT */

#ui {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  z-index: 5;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

#go, .final-button {
  font-family: inherit;
  font-style: italic;
  font-weight: 600;
  font-size: clamp(22px,4.6vw,30px);
  color: #3a1a58;
  background: linear-gradient(135deg,#ffd6e0,#ff8fab);
  border: 0;
  border-radius: 999px;
  padding: .7em 1.6em;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  transition: transform .3s ease;
}

#go {
  opacity: 0;
  animation: pop 1.2s ease 3.4s forwards,
             beat 2.6s ease-in-out 4.6s infinite;
}

#go:hover, .final-button:hover {
  transform: scale(1.05);
}

@keyframes beat {
  50% {
    box-shadow:
      0 0 0 16px rgba(255,143,171,0),
      0 10px 30px rgba(0,0,0,.35);
    transform: scale(1.04);
  }
}

#go:focus-visible, .final-button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 4px;
}

/* MESSAGE CARD */

#msg {
  display: none;
  width: min(100%, 620px);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  text-align: center;
  padding: 28px 26px;
  border-radius: 26px;
  background: rgba(29,18,51,.76);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,194,209,.35);
  box-shadow: 0 0 60px rgba(255,143,171,.25);
}

#msg.show {
  display: block;
}

#msg::-webkit-scrollbar {
  width: 5px;
}

#msg::-webkit-scrollbar-thumb {
  background: var(--rose);
  border-radius: 10px;
}

.day-indicator {
  display: inline-block;
  padding: 6px 17px;
  margin-bottom: 22px;
  border: 1px solid rgba(255,194,209,.4);
  border-radius: 30px;
  color: var(--glow);
  font-size: 17px;
  font-style: italic;
}

.day-message {
  padding-bottom: 28px;
  margin-bottom: 25px;
  border-bottom: 1px solid rgba(255,194,209,.25);
}

.day-message:last-of-type {
  border-bottom: none;
}

.day-message h1 {
  margin: 0 0 18px;
  font-size: clamp(30px,7vw,42px);
  font-weight: 600;
  font-style: italic;
  color: var(--glow);
}

.day-message h2 {
  color: #ffd6e0;
  font-size: 26px;
  font-style: italic;
  margin: 0 0 16px;
}

#msg p {
  margin: .65em 0;
  text-wrap: balance;
  font-size: clamp(19px,4.6vw,23px);
  line-height: 1.55;
  font-style: italic;
  opacity: 0;
  transform: translateY(8px);
  animation: line 1.1s ease forwards;
}

@keyframes line {
  to {
    opacity: 1;
    transform: none;
  }
}

.signature {
  color: var(--glow);
  font-size: 24px !important;
}

.final-area {
  padding: 25px 0 10px;
  border-top: 1px solid rgba(255,194,209,.25);
  margin-top: 20px;
}

.final-button {
  font-size: clamp(20px,4.5vw,25px);
  margin: 20px auto;
  display: inline-block;
  animation: beat 2.6s ease-in-out infinite;
}

.final-letter {
  display: none;
  padding-top: 25px;
  margin-top: 20px;
  border-top: 1px solid rgba(255,194,209,.3);
}

.final-letter.show {
  display: block;
  animation: line 1.2s ease forwards;
}

.final-letter h1 {
  color: var(--glow);
  font-size: clamp(30px,7vw,40px);
  font-style: italic;
  margin-bottom: 25px;
}

.last-words {
  color: #ffb5ca !important;
  font-size: clamp(26px,6vw,34px) !important;
  font-weight: 600;
  margin-top: 28px !important;
}

.lock-message {
  max-width: 430px;
  text-align: center;
  padding: 30px;
}

.lock-message h1 {
  color: var(--glow);
  font-size: 38px;
  font-style: italic;
}

.lock-message p {
  font-size: 23px;
  line-height: 1.5;
}

.fp {
  position: fixed;
  top: -30px;
  width: 14px;
  height: 18px;
  border-radius: 50% 50% 50% 50%/75% 75% 25% 25%;
  background: linear-gradient(var(--c1),var(--c2));
  opacity: .9;
  animation: fall linear forwards;
  pointer-events: none;
}

@keyframes fall {
  to {
    transform: translate(var(--dx),110vh) rotate(var(--r));
  }
}

@media(max-width:600px) {
  #msg {
    padding: 24px 19px;
    max-height: calc(100vh - 24px);
  }

  #ui {
    padding: 12px;
  }

  .day-message {
    padding-bottom: 22px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0s !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<div id="sky"></div>

<div id="garden">
  <div class="ground"></div>
</div>

<div id="fall"></div>

<div id="ui">

  <button id="go" type="button">
    Click this for a message 💗
  </button>

  <div id="msg" role="status" aria-live="polite"></div>

</div>

<script>

/* ==========================================
   PERSONALIZED ANNIVERSARY MESSAGES
   Edit your messages here whenever you want.
========================================== */

const FROM = "Noel Shane ❤️";

const MESSAGES = [

  {
    date: "2026-11-24",
    heading: "Hi Sappppp!!! 💗",
    title: "Day 1 — A Little Reminder",
    lines: [
      `Babyyyyyyyyyy today is November 24, 2 more day to go, I cut this message for 3 day and ayun nga I just wanted to let you know that I am always proud of you baby and I hope you always remember how important you are to me.`,

      `I know even if you don't tell me you have a lot carrying on your shoulders aswell so please if you feel tired, alone, lonely or something else please know that I am always here lang.`,

      `Asawa moko ehh you don't have to do or deal with everything alone. Just like you always do to me, I am also here to support you, help you and someone you can lean on too.`,

      `I love you so much baby and I am and will always be grateful na nakilala ko ang isang babaeng katulad mo. I am so thankful to have someone special as you in my life.`,

      `You will always be my number one duo, fan and supporter.`,

      `I hope you'll never unlove me 🥺, even on the days I am hard to love 🥹`
    ]
  },

  {
    date: "2026-11-25",
    heading: "Babyyyyy!!! 💗",
    title: "Day 2 — My Even If",
    lines: [
      `Today is November 25, tomorrow naaaa excited ako mwehehehe..`,

      `Here's my message: please let me be your even if instead of what if 🥺.`,

      `Even if nothing goes as planned. Even if we are tired and the words come out wrong. Even if the days are long and our patience is short. Even if everything feels wrong and the world is like going apart.`,

      `I will still choose you.`,

      `I will kiss your forehead, I will still give you kisses on your nose and cheeks, your presence over silence, your corny joke and pangaasar, our love over ego, and us over pride.`,

      `I will always and will always choose to love you baby every single second of time. ❤️`
    ]
  },

  {
    date: "2026-11-26",
    heading: "Happy Happy 1st Anniversary Baby!!! 💗",
    title: "Day 3 — To My Forever",
    lines: [
      `Pleasee know that I love you so so much babyy and I will never get tired of loving you and I can't wait till the day that we get to marry each other 🥺`,

      `Thank you baby for loving me even on the days na mahirap ako mahalin. I know madami rin ako pagkukulang and shortcomings. But thank you baby for still choosing me, for choosing to stay.`,

      `Sana pag may mga bagay ako o something na hindi maibigay hindi mo hanapin sa iba. Sana patuloy mo parin ako piliin especially sa mga araw na hindi tayo nagkakaintindihan.`,

      `Please don't ever leave me baby haa. I'll cry for real.`,

      `Mahal na mahal kita baby more than words could explain.`,

      `And please know that kahit anong mangyare I will always be here, your home, your safe space, your doctor, dentist, analyst charot, your joker and a yapper boyfriend, your number one supporter and strongest Duo.`,

      `Lagi mo akong kasama baby sa lahat.`,

      `Happy Anniversary baby, I love you so much! ❤️`
    ]
  }

];


/* ==========================================
   FINAL ANNIVERSARY SURPRISE
========================================== */

const FINAL_MESSAGE = {
  heading: "One Last Thing, Baby... 💗",
  lines: [
    `Babyyyyy, if you're reading this, it means you've reached the last part of my little surprise for you. 🥺`,

    `I know these past three days are just a small thing compared to everything I want to give you, but I hope every message made you feel how much you are loved and appreciated.`,

    `Baby, I don't know exactly what the future holds for us. We might have difficult days, misunderstandings, unexpected challenges, and moments when things don't go as planned. But one thing I want you to always remember is that I want you in my future.`,

    `I want the ordinary days with you. Yung simpleng good mornings, random kwentos, kulitans, tawanan, tampuhan, and even those moments na wala tayong ginagawa but we're happy just because we're together.`,

    `I want to celebrate your achievements, comfort you when things get difficult, support your dreams, and be beside you while we both grow into the people we want to become.`,

    `And someday, baby, I hope these little anniversary surprises will turn into actual flowers I can give you personally, hugs I don't have to end, and kisses that aren't limited by distance or time.`,

    `I want to marry you. I want to build a home with you. I want to grow old with you and still be your number one duo kahit senior citizen na tayo HAHAHAHA.`,

    `Thank you for being my favorite person, my happiness, my pahinga, and my greatest blessing.`,

    `If there's one thing I want to ask from you, it's this: let's keep choosing each other. Let's keep growing, understanding, forgiving, and loving each other.`,

    `Happy 1st Anniversary, my baby.`,

    `I love you to the moon and back, to infinity and beyond, and even farther than words could ever reach. ❤️`
  ],
  closing: "Ikaw pa rin. Ikaw palagi. Ikaw hanggang dulo. ❤️"
};


/* ==========================================
   FLOWER GARDEN ANIMATIONS
========================================== */

const $ = s => document.querySelector(s);

const rnd = (a,b) => a + Math.random() * (b-a);

const PAL = [
  ["#ffd6e0","#ff6f91"],
  ["#ffe5d0","#ff9e7a"],
  ["#f3e1ff","#b57edc"],
  ["#fff5f7","#ffa8c5"],
  ["#ffeaa7","#ff9f68"],
  ["#ffc2d1","#e8567f"]
];

const sky = $('#sky');
const garden = $('#garden');

for(let i=0;i<70;i++) {
  const s = document.createElement('i');
  s.className = 'star';
  s.style.cssText =
    `left:${rnd(0,100)}%;top:${rnd(0,70)}%;animation-delay:${rnd(0,4)}s`;
  sky.appendChild(s);
}

for(let i=0;i<16;i++) {
  const f = document.createElement('i');
  f.className = 'fly';
  f.style.cssText =
    `left:${rnd(3,97)}%;top:${rnd(45,92)}%;animation-delay:${rnd(2,9)}s;animation-duration:${rnd(7,12)}s`;
  garden.appendChild(f);
}

const N = innerWidth < 600 ? 6 : 10;
const vh = innerHeight / 100;

for(let i=0;i<N;i++) {

  const H = rnd(17,36) * vh;
  const sd = rnd(0,1.6);
  const P = PAL[i % PAL.length];
  const sc = rnd(.7,1.15);
  const n = Math.random() < .5 ? 8 : 10;

  const f = document.createElement('div');
  f.className = 'flower';

  f.style.left =
    (10 + (i+.5)/N*80 + rnd(-2,2)) + '%';

  f.style.animationDelay = rnd(0,3) + 's';

  let h =
    `<div class="stem" style="height:${H}px;animation-delay:${sd}s"></div>`;

  h +=
    `<div class="leaf" style="bottom:${H*.3}px;left:2px;transform:rotate(-20deg);animation-delay:${sd+1.2}s"></div>`;

  h +=
    `<div class="leaf" style="bottom:${H*.5}px;left:-24px;transform:scaleX(-1) rotate(-20deg);animation-delay:${sd+1.4}s"></div>`;

  h +=
    `<div class="bloom" style="bottom:${H}px;transform:scale(${sc})">`;

  for(let k=0;k<n;k++) {
    h +=
      `<div class="petal" style="--a:${k*360/n}deg;--c1:${P[1]};--c2:${P[0]};animation-delay:${sd+2.1+k*.09}s"></div>`;
  }

  h +=
    `<div class="core" style="animation-delay:${sd+3}s"></div></div>`;

  f.innerHTML = h;
  garden.appendChild(f);
}


/* ==========================================
   FALLING PETALS
========================================== */

function petals(count) {

  const box = $('#fall');

  for(let i=0;i<count;i++) {

    const p = document.createElement('i');
    const c = PAL[i % PAL.length];

    p.className = 'fp';

    p.style.cssText =
      `left:${rnd(0,100)}%;--c1:${c[0]};--c2:${c[1]};--dx:${rnd(-80,80)}px;--r:${rnd(180,720)}deg;animation-duration:${rnd(5,10)}s;animation-delay:${rnd(0,3)}s`;

    box.appendChild(p);

    setTimeout(() => p.remove(),14000);
  }
}


/* ==========================================
   PHILIPPINE DATE DETECTION
========================================== */

function getPhilippinesDate() {

  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Manila',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(new Date());

  const date = {};

  parts.forEach(p => {
    date[p.type] = p.value;
  });

  return `${date.year}-${date.month}-${date.day}`;
}

const today = getPhilippinesDate();

const unlockedMessages = MESSAGES.filter(
  message => today >= message.date
);


/* ==========================================
   PAGE INITIALIZATION
========================================== */

const go = $('#go');
const msg = $('#msg');

if(unlockedMessages.length === 0) {

  go.style.display = 'none';

  const firstDate = new Date(MESSAGES[0].date + 'T00:00:00+08:00');

  const dateText = firstDate.toLocaleDateString('en-PH', {
    timeZone: 'Asia/Manila',
    month: 'long',
    day: 'numeric',
    year: 'numeric'
  });

  msg.innerHTML = `
    <div class="lock-message">
      <h1>Something special is coming... 💗</h1>
      <p>Your first surprise is waiting for you.</p>
      <p>Come back on ${dateText}, baby! 🥺</p>
      <p>Until then, sending you lots of kisses! 💋</p>
    </div>
  `;

  msg.classList.add('show');

} else {

  go.textContent = "Open your surprise 💗";

  go.addEventListener('click', () => {

    go.style.display = 'none';
    msg.innerHTML = '';

    const indicator = document.createElement('div');
    indicator.className = 'day-indicator';
    indicator.textContent =
      `${unlockedMessages.length} of 3 surprises unlocked 💗`;

    msg.appendChild(indicator);

    unlockedMessages.forEach((item,index) => {

      const section = document.createElement('div');
      section.className = 'day-message';

      const heading = document.createElement('h2');
      heading.textContent = item.heading;
      section.appendChild(heading);

      const title = document.createElement('h1');
      title.textContent = item.title;
      section.appendChild(title);

      item.lines.forEach((line,i) => {

        const p = document.createElement('p');
        p.textContent = line;

        p.style.animationDelay =
          `${0.5 + i * 1.1 + index * 0.5}s`;

        section.appendChild(p);
      });

      msg.appendChild(section);
    });

    const signature = document.createElement('p');
    signature.className = 'signature';
    signature.textContent = '— ' + FROM;
    signature.style.animationDelay = '1s';

    msg.appendChild(signature);

    /* Show the final surprise button only on Day 3 */

    if(today >= MESSAGES[2].date) {

      const finalArea = document.createElement('div');
      finalArea.className = 'final-area';

      const invitation = document.createElement('p');
      invitation.textContent =
        "Wait baby... I still have one last thing for you. 🥺";
      invitation.style.animationDelay = '1s';

      const finalButton = document.createElement('button');
      finalButton.className = 'final-button';
      finalButton.textContent = "One last thing, baby... 💗";

      const finalLetter = document.createElement('div');
      finalLetter.className = 'final-letter';

      finalButton.addEventListener('click', () => {

        finalButton.style.display = 'none';
        invitation.style.display = 'none';

        const finalHeading = document.createElement('h1');
        finalHeading.textContent = FINAL_MESSAGE.heading;
        finalLetter.appendChild(finalHeading);

        FINAL_MESSAGE.lines.forEach((line,i) => {

          const p = document.createElement('p');
          p.textContent = line;
          p.style.animationDelay = `${0.5 + i * 1.2}s`;

          finalLetter.appendChild(p);
        });

        const closing = document.createElement('p');
        closing.className = 'last-words';
        closing.textContent = FINAL_MESSAGE.closing;
        closing.style.animationDelay =
          `${0.5 + FINAL_MESSAGE.lines.length * 1.2}s`;

        finalLetter.appendChild(closing);

        const finalSignature = document.createElement('p');
        finalSignature.className = 'signature';
        finalSignature.textContent = 'Forever yours, ' + FROM;
        finalSignature.style.animationDelay =
          `${1 + FINAL_MESSAGE.lines.length * 1.2}s`;

        finalLetter.appendChild(finalSignature);

        finalLetter.classList.add('show');

        petals(100);

        setTimeout(() => petals(60),4000);
        setTimeout(() => petals(60),8000);

        finalLetter.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });

      });

      finalArea.appendChild(invitation);
      finalArea.appendChild(finalButton);
      finalArea.appendChild(finalLetter);

      msg.appendChild(finalArea);
    }

    msg.classList.add('show');

    petals(40);
    setTimeout(() => petals(25),5000);

  });

}

</script>

</body>
</html>
